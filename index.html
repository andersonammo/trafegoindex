<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Ammo - Nuvem</title>
    <style>
        :root {
            --ammo-black: #121212;
            --ammo-yellow: #FFD700;
            --ammo-dark-grey: #1E1E1E;
            --text-color: #FFFFFF;
        }

        body {
            font-family: sans-serif;
            background-color: var(--ammo-black);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--ammo-dark-grey);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--ammo-yellow);
        }

        h1 { color: var(--ammo-yellow); text-align: center; font-size: 20px; }

        label { display: block; margin-top: 15px; font-size: 14px; }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background-color: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn {
            background-color: var(--ammo-yellow);
            color: var(--ammo-black);
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            text-transform: uppercase;
        }

        .btn:disabled { background-color: #555; cursor: not-allowed; }

        .hidden { display: none; }
        
        .user-info { font-size: 12px; text-align: center; margin-bottom: 20px; color: #888; }
    </style>
</head>
<body>

    <div class="container" id="setupScreen">
        <h1>Identificação</h1>
        <input type="text" id="colaboradorNome" placeholder="Seu nome">
        <input type="text" id="oticaNome" placeholder="Sua Loja">
        <button class="btn" onclick="salvarUser()">Entrar</button>
    </div>

    <div class="container hidden" id="mainScreen">
        <div class="user-info">
            <span id="infoUser"></span>
        </div>
        <h1>Novo Lead</h1>
        <form id="leadForm">
            <input type="text" id="nome" placeholder="Nome do Cliente" required>
            <input type="tel" id="telefone" placeholder="WhatsApp" required>
            <select id="canal" required>
                <option value="">Canal de Captura</option>
                <option value="Instagram">Instagram</option>
                <option value="Facebook">Facebook</option>
                <option value="Google">Google</option>
            </select>
            <input type="text" id="produto" placeholder="Produto" required>
            <input type="number" id="orcamento" placeholder="Orçamento R$" required>
            <select id="comprou" onchange="document.getElementById('divVenda').classList.toggle('hidden', this.value !== 'Sim')" required>
                <option value="Não">Não comprou</option>
                <option value="Sim">Sim, comprou</option>
            </select>
            <div id="divVenda" class="hidden">
                <input type="number" id="valorVenda" placeholder="Valor da Venda R$">
            </div>
            <input type="text" id="objecao" placeholder="Objeção/Observação" required>
            
            <button type="submit" id="btnSalvar" class="btn">Enviar e Confirmar WhatsApp</button>
        </form>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyvtJG-bP6hTvkgrubmqBJfT470gFeiG1wHM_99y3fhUDakW9Zy8WD3djHWrK_XNe1v/exec";

        let config = JSON.parse(localStorage.getItem('ammo_cfg')) || null;

        window.onload = () => { if(config) mostrarPainel(); };

        function salvarUser() {
            const colab = document.getElementById('colaboradorNome').value;
            const loja = document.getElementById('oticaNome').value;
            if(!colab || !loja) return alert("Preencha os dados");
            config = { colaborador: colab, otica: loja };
            localStorage.setItem('ammo_cfg', JSON.stringify(config));
            mostrarPainel();
        }

        function mostrarPainel() {
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('infoUser').innerText = `${config.colaborador} @ ${config.otica}`;
        }

        document.getElementById('leadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            btn.innerText = "Enviando...";

            const dados = {
                Data: new Date().toLocaleString('pt-BR'),
                Colaborador: config.colaborador,
                Unidade: config.otica,
                Cliente: document.getElementById('nome').value,
                WhatsApp: document.getElementById('telefone').value,
                Canal: document.getElementById('canal').value,
                Produto: document.getElementById('produto').value,
                Orcamento: document.getElementById('orcamento').value,
                Status_Compra: document.getElementById('comprou').value,
                Valor_Venda: document.getElementById('valorVenda').value || 0,
                Objecao: document.getElementById('objecao').value
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            }).then(() => {
                // Mensagem formatada para o WhatsApp
                const foneWhatsApp = "5541996509734";
                const textoMensagem = encodeURIComponent(
                    `✅ *RELATÓRIO ENVIADO COM SUCESSO*\n\n` +
                    `👤 *Colaborador:* ${dados.Colaborador}\n` +
                    `🏢 *Loja:* ${dados.Unidade}\n` +
                    `📅 *Data:* ${dados.Data}\n\n` +
                    `*DADOS DO LEAD:*\n` +
                    `• Cliente: ${dados.Cliente}\n` +
                    `• Tel: ${dados.WhatsApp}\n` +
                    `• Canal: ${dados.Canal}\n` +
                    `• Produto: ${dados.Produto}\n` +
                    `• Orçamento: R$ ${dados.Orcamento}\n` +
                    `• Comprou: ${dados.Status_Compra}\n` +
                    `• Valor Venda: R$ ${dados.Valor_Venda}\n` +
                    `• Objeção: ${dados.Objecao}`
                );

                const urlWhatsApp = `https://wa.me/${foneWhatsApp}?text=${textoMensagem}`;

                alert("Salvo na planilha! Abrindo confirmação no WhatsApp...");
                
                // Abre o WhatsApp
                window.open(urlWhatsApp, '_blank');

                // Reseta o formulário
                document.getElementById('leadForm').reset();
                document.getElementById('divVenda').classList.add('hidden');
                btn.disabled = false;
                btn.innerText = "Enviar e Confirmar WhatsApp";

            }).catch(err => {
                alert("Erro ao enviar para a nuvem. Verifique sua conexão.");
                btn.disabled = false;
                btn.innerText = "Tentar Novamente";
            });
        });
    </script>
</body>
</html>
