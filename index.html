<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads Óticas Ammo - Banco de Dados Local</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --ammo-black: #121212;
            --ammo-yellow: #FFD700;
            --ammo-dark-grey: #1E1E1E;
            --ammo-light-grey: #333333;
            --text-color: #FFFFFF;
            --success-green: #25D366;
            --danger-red: #ff4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--ammo-black);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--ammo-dark-grey);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.15);
            border: 1px solid #333;
        }

        h1, h2 {
            color: var(--ammo-yellow);
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #ccc;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background-color: var(--ammo-light-grey);
            border: 1px solid #555;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--ammo-yellow);
            background-color: #444;
        }

        .btn {
            background-color: var(--ammo-yellow);
            color: var(--ammo-black);
            font-weight: 800;
            padding: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .btn:hover { background-color: #e6c200; }

        .btn-report {
            background-color: #1a73e8;
            color: white;
            margin-top: 15px;
        }

        .btn-clear {
            background-color: transparent;
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
            margin-top: 10px;
            font-size: 14px;
            padding: 10px;
        }

        .table-wrapper {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
            border: 1px solid #444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: var(--ammo-yellow);
            color: var(--ammo-black);
            position: sticky;
            top: 0;
        }

        .hidden { display: none; }
        
        .user-info {
            background: rgba(255, 215, 0, 0.1);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="container" id="setupScreen">
        <h1>Configuração Inicial</h1>
        <label>Nome do Colaborador:</label>
        <input type="text" id="colaboradorNome" placeholder="Seu nome">
        <label>Nome da Unidade/Ótica:</label>
        <input type="text" id="oticaNome" placeholder="Ex: Ammo Centro">
        <button class="btn" onclick="entrar()">Acessar Sistema</button>
    </div>

    <div class="container hidden" id="mainScreen">
        <div class="user-info">
            <span id="displayColaborador"></span> | <span id="displayOtica"></span>
        </div>

        <h1>Cadastro de Lead</h1>

        <form id="leadForm">
            <label>Nome do Cliente *</label>
            <input type="text" id="nome" required>

            <label>Telefone *</label>
            <input type="tel" id="telefone" required>

            <label>Canal de Captura *</label>
            <select id="canal" required>
                <option value="">Selecione...</option>
                <option value="Instagram">Instagram</option>
                <option value="Facebook">Facebook</option>
                <option value="Google Ads">Google Ads</option>
                <option value="TikTok">TikTok</option>
                <option value="Indicação">Indicação</option>
            </select>

            <label>Produto de Interesse *</label>
            <input type="text" id="produto" required>

            <label>Orçamento (R$) *</label>
            <input type="number" id="orcamento" step="0.01" required>

            <label>Comprou? *</label>
            <select id="comprou" onchange="verificarCompra()" required>
                <option value="Não">Não</option>
                <option value="Sim">Sim</option>
            </select>

            <div id="divValorVenda" class="hidden">
                <label>Valor da Venda (R$) *</label>
                <input type="number" id="valorVenda" step="0.01">
            </div>

            <label>Objeção do Cliente *</label>
            <input type="text" id="objecao" required>

            <button type="submit" class="btn">💾 Salvar Lead</button>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Nome</th>
                        <th>Canal</th>
                        <th>Venda</th>
                    </tr>
                </thead>
                <tbody id="tabelaBody"></tbody>
            </table>
        </div>

        <button class="btn btn-report" onclick="baixarRelatorio()">
            📊 Gerar Relatório Excel (.xlsx)
        </button>
        
        <button class="btn btn-clear" onclick="limparTudo()">
            🗑️ Limpar Banco de Dados
        </button>
    </div>

    <script>
        let leads = JSON.parse(localStorage.getItem('db_leads_ammo')) || [];
        let config = JSON.parse(localStorage.getItem('cfg_usuario_ammo')) || {};

        window.onload = () => {
            if (config.colaborador) {
                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
                document.getElementById('displayColaborador').innerText = config.colaborador;
                document.getElementById('displayOtica').innerText = config.otica;
                atualizarTabela();
            }
        };

        function entrar() {
            const c = document.getElementById('colaboradorNome').value;
            const o = document.getElementById('oticaNome').value;
            if(!c || !o) return alert("Preencha tudo!");
            config = { colaborador: c, otica: o };
            localStorage.setItem('cfg_usuario_ammo', JSON.stringify(config));
            location.reload();
        }

        function verificarCompra() {
            const div = document.getElementById('divValorVenda');
            div.classList.toggle('hidden', document.getElementById('comprou').value !== 'Sim');
        }

        document.getElementById('leadForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const novo = {
                Data: new Date().toLocaleDateString('pt-BR'),
                Colaborador: config.colaborador,
                Unidade: config.otica,
                Nome: document.getElementById('nome').value,
                Telefone: document.getElementById('telefone').value,
                Canal: document.getElementById('canal').value,
                Produto: document.getElementById('produto').value,
                Orcamento: document.getElementById('orcamento').value,
                Comprou: document.getElementById('comprou').value,
                ValorVenda: document.getElementById('valorVenda').value || 0,
                Objecao: document.getElementById('objecao').value
            };
            leads.push(novo);
            localStorage.setItem('db_leads_ammo', JSON.stringify(leads));
            document.getElementById('leadForm').reset();
            verificarCompra();
            atualizarTabela();
            alert("Lead Salvo!");
        });

        function atualizarTabela() {
            const body = document.getElementById('tabelaBody');
            body.innerHTML = leads.map(l => `
                <tr>
                    <td>${l.Data}</td>
                    <td>${l.Nome}</td>
                    <td>${l.Canal}</td>
                    <td>R$ ${l.ValorVenda}</td>
                </tr>
            `).join('');
        }

        function baixarRelatorio() {
            if (leads.length === 0) return alert("Sem dados!");
            const ws = XLSX.utils.json_to_sheet(leads);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Leads");
            XLSX.writeFile(wb, `Relatorio_Ammo_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        function limparTudo() {
            if(confirm("Apagar tudo permanentemente?")) {
                localStorage.removeItem('db_leads_ammo');
                location.reload();
            }
        }
    </script>
</body>
</html>
